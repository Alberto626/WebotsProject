#VRML_SIM R2025a utf8

PROTO SoilMoistureSensor [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 0 1 0
  field SFString controller "SoilMoistureSensor"
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name "SoilMoistureSensor"
    controller IS controller

    children [
      # Main sensor housing
      Transform {
        translation 0 0 0.16
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.12 0.13 0.14
              roughness 0.7
              metalness 0
            }
            geometry Box {
              size 0.14 0.07 0.12
            }
          }
        ]
      }

      # Turquoise indicator on the front
      Transform {
        translation 0 -0.036 0.17
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.0 0.8 0.65
              emissiveColor 0.0 0.15 0.1
            }
            geometry Box {
              size 0.045 0.004 0.025
            }
          }
        ]
      }

      # Left metal prong
      Transform {
        translation -0.035 0 0.015
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.65 0.67 0.69
              roughness 0.35
              metalness 0.8
            }
            geometry Box {
              size 0.012 0.018 0.25
            }
          }
        ]
      }

      # Right metal prong
      Transform {
        translation 0.035 0 0.015
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.65 0.67 0.69
              roughness 0.35
              metalness 0.8
            }
            geometry Box {
              size 0.012 0.018 0.25
            }
          }
        ]
      }
    ]
  }
}
